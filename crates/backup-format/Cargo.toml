[package]
name = "kagnode-backup-format"
version = "5.0.3"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Versioned encrypted KagNode backup manifests and bounded recovery"
[dependencies]
anyhow = "1"
age = { version = "0.12", default-features = false }
hex = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
tar = "0.4"
libc = "0.2"
[dev-dependencies]
tempfile = "3"
